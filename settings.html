<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ExpensePro — Settings</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
  .settings-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }
  .panel{ border-radius:18px; padding:22px; background:var(--glass-fill); border:1px solid var(--glass-border); }
  .panel-title{ font-family:var(--font-display); font-weight:700; font-size:15px; margin-bottom:6px; }
  .pref-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--glass-border); gap:20px; }
  .pref-row:last-child{ border-bottom:none; }
  .pref-name{ font-size:13.5px; font-weight:600; }
  .pref-sub{ font-size:12px; color:var(--text-tertiary); margin-top:3px; }
  .link-row{ display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:12px; background:var(--glass-fill-strong); border:1px solid var(--glass-border); margin-bottom:12px; transition:border-color .2s; }
  .link-row:hover{ border-color:var(--glass-border-strong); }
  .link-row .li{ width:34px; height:34px; border-radius:10px; background:var(--glass-fill); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .link-row .lt{ font-size:13.5px; font-weight:600; flex:1; }
  .danger-panel{ margin-top:16px; }
  @media (max-width:900px){ .settings-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body class="app">
  <canvas id="aurora-canvas"></canvas>
  <div class="noise"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <aside id="sidebar" class="glass"></aside>

  <main id="main">
    <div id="topbar"></div>

    <div class="settings-grid">
      <div class="panel fade-in">
        <div class="panel-title">Preferences</div>
        <div id="pref-list"></div>
      </div>

      <div>
        <div class="panel fade-in" style="margin-bottom:16px;">
          <div class="panel-title">Security</div>
          <div style="margin-top:14px;">
            <div class="link-row"><span class="li"><svg class="icon" viewBox="0 0 24 24"><path d="M21 2l-2 2M14.5 8.5L8 15M15 6l3 3M11 12l3 3M6 16l-3 3 3 1 1 3 3-3M13 3a5 5 0 015 5"/></svg></span><span class="lt">Change password</span><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M9 18l6-6-6-6"/></svg></div>
            <div class="link-row"><span class="li"><svg class="icon" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg></span><span class="lt">Two-factor authentication</span><svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M9 18l6-6-6-6"/></svg></div>
          </div>
        </div>

        <div class="panel fade-in danger-panel">
          <div class="panel-title" style="color:var(--danger);">Danger zone</div>
          <a href="index.html" class="btn btn-danger btn-block" style="margin-top:14px;"><svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</a>
        </div>
      </div>
    </div>
  </main>

<script src="assets/js/base.js"></script>
<script>
(function(){
  EP_renderShell('settings', 'Settings', 'Preferences, security, and appearance.');

  var prefs = [
    {name:'Push notifications', sub:'Get notified about bills, budgets, and goals', on:true},
    {name:'Weekly email summary', sub:'A digest of your finances every Monday', on:true},
    {name:'Biometric app lock', sub:'Require Face ID or fingerprint to open ExpensePro', on:false},
    {name:'Interface sounds', sub:'Subtle audio feedback on actions', on:true},
    {name:'AI insight scanning', sub:'Allow ExpensePro to analyze spending for insights', on:true}
  ];
  document.getElementById('pref-list').innerHTML = prefs.map(function(p,i){
    return '<div class="pref-row"><div><div class="pref-name">'+p.name+'</div><div class="pref-sub">'+p.sub+'</div></div>'
      + '<button class="toggle'+(p.on?' on':'')+'" data-i="'+i+'"><span class="toggle-knob"></span></button></div>';
  }).join('');
  document.getElementById('pref-list').addEventListener('click', function(e){
    var t = e.target.closest('.toggle'); if(!t) return;
    t.classList.toggle('on');
  });

  window.EP_bindCursorHover(document);
})();
</script>
</body>
</html>
